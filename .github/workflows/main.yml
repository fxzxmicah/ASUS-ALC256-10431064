name: Build RPM & Release

on:
  push:
    paths:
      - 'SPECS/**'
      - 'SOURCES/**'
      - 'upstream/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  job:
    runs-on: ubuntu-latest
    container: fedora:${{ github.ref_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          dnf install -y rpmdevtools perl

      - name: Check Kernel Patch
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/torvalds/linux/5b0764a53235d3c77e1ed674e836e1b3fe1a4b1f/scripts/checkpatch.pl \
            -o /tmp/checkpatch.pl
          perl /tmp/checkpatch.pl --no-tree --strict --no-signoff upstream/*.patch

      - name: Configure RPM Macros
        run: |
          cat > ~/.rpmmacros <<EOF
          %vendor GitHub (${{ github.repository }})
          # Different with "github.workspace" in container environment
          %_topdir ${GITHUB_WORKSPACE}
          EOF

      - name: Build RPM Packages
        run: |
          dnf builddep -y SPECS/*.spec
          tar -cJf SOURCES/realtek.tar.xz -C SOURCES realtek
          spectool --get-files --sourcedir SPECS/*.spec
          rpmbuild -ba SPECS/*.spec

      - name: Check and Prepare Release
        id: vars
        run: |
          echo "version=$(rpm -q --queryformat="%{VERSION}-%{RELEASE}" kernel-devel)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          files: RPMS/*/*
